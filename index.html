<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SINCOY MART UNICORN</title><style>*{margin:0;padding:0;box-sizing:border-box}body{margin:0;background:#a0d8ef;overflow:hidden;font-family:system-ui;font-weight:900}#c{display:block;width:100vw;height:100vh}#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;z-index:20}.badge{background:#fff;border:3px solid #000;border-radius:100px;padding:8px;font-size:10px;box-shadow:4px 4px 0 #000;flex:1;text-align:center}#menu{position:fixed;inset:0;z-index:100;background:linear-gradient(#a0d8ef,#ffeb3b,#7b2cbf);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}.card{background:#fff;border:5px solid #000;border-radius:24px;padding:18px;max-width:360px;box-shadow:12px 12px 0 #000}.btn{width:100%;padding:14px;border-radius:100px;border:4px solid #000;background:#ffeb3b;color:#000;font-weight:900;font-size:16px;margin-top:10px}</style></head><body><canvas id="c"></canvas><div id="hud"><div class="badge">💰 Rp <span id="money">80000</span></div><div class="badge">🦄 <span id="cust">0</span></div><div class="badge">⭐ <span id="rating">5.0</span></div></div><div id="menu"><div style="font-size:80px">🦄🥥</div><h1>SINCOY MART<br>UNICORN</h1><div class="card"><p style="font-size:12px">Toko unicorn Sincoy! Jual kelapa, snack, minuman! Tap rak buat restock!</p><button class="btn" id="play">🦄 BUKA TOKO!</button></div></div><script>
let canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
function rs(){canvas.width=innerWidth*2;canvas.height=innerHeight*2;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';}
rs();let S={money:80000,cust:0,rating:5,playing:false,shelves:{a:100,b:100,c:100},queue:[]};
let shelves=[{x:40,y:140,w:canvas.width/2-60,h:180,t:'🦄 UNICORN',k:'a'},{x:40,y:350,w:canvas.width/2-60,h:180,t:'🥥 KELAPA',k:'b'},{x:canvas.width/2+20,y:140,w:canvas.width/2-60,h:180,t:'🥤 MINUM',k:'c'},{x:canvas.width/2+20,y:350,w:canvas.width/2-60,h:140,t:'KASIR',k:'z'}];
let customers=[];
function draw(){
let w=canvas.width,h=canvas.height;ctx.fillStyle='#a0d8ef';ctx.fillRect(0,0,w,h);
ctx.fillStyle='#fff';for(let i=0;i<15;i++){ctx.beginPath();ctx.arc((i*173)%w,(i*97)%300,12,0,7);ctx.fill();}
shelves.forEach(s=>{ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.fillRect(s.x,s.y,s.w,s.h);ctx.strokeRect(s.x,s.y,s.w,s.h);ctx.fillStyle=s.k==='z'?'#ffeb3b':'#7b2cbf';ctx.fillRect(s.x,s.y,s.w,30);ctx.strokeRect(s.x,s.y,s.w,30);ctx.fillStyle=s.k==='z'?'#000':'#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText(s.t,s.x+s.w/2,s.y+20);if(s.k!=='z'){let cnt=Math.floor(S.shelves[s.k]/18);for(let i=0;i<cnt;i++){let px=s.x+10+i*30,py=s.y+50+(i%2)*50;ctx.font='22px Arial';ctx.fillText(s.k==='a'?'🦄':s.k==='b'?'🥥':'🥤',px,py);}}});
customers.forEach(c=>{ctx.font='32px Arial';ctx.fillText(c.i,c.x,c.y);});
}
function spawn(){if(!S.playing||customers.length>5)return;customers.push({x:100+Math.random()*(canvas.width-200),y:canvas.height,tx:100+Math.random()*(canvas.width-200),ty:180+Math.random()*300,i:['🧕','👩‍🎓','👶','🦄'][Math.floor(Math.random()*4)],w:['a','b','c'][Math.floor(Math.random()*3)],s:'go'});}
function upd(){
if(!S.playing)return;customers.forEach((c,i)=>{let dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);if(d<10){if(S.shelves[c.w]>5){S.shelves[c.w]-=15;S.queue.push(c);customers.splice(i,1);}else{customers.splice(i,1);}}else{c.x+=dx*0.03;c.y+=dy*0.03;}});draw();requestAnimationFrame(upd);
}
let qDiv=document.createElement('div');qDiv.style.cssText='position:fixed;bottom:100px;left:10px;right:10px;display:flex;gap:6px;z-index:15';document.body.appendChild(qDiv);
setInterval(spawn,1500);upd();draw();
document.getElementById('play').onclick=()=>{S.playing=true;document.getElementById('menu').style.display='none';canvas.onclick=e=>{let r=canvas.getBoundingClientRect();let x=(e.clientX-r.left)*2,y=(e.clientY-r.top)*2;shelves.forEach(s=>{if(x>=s.x&&x<=s.x+s.w&&y>=s.y&&y<=s.y+s.h&&s.k!=='z'&&S.money>=5000){S.money-=5000;S.shelves[s.k]=100;document.getElementById('money').textContent=S.money;}});};setInterval(()=>{if(S.queue.length>0){let c=S.queue.shift();S.money+=10000;S.cust++;document.getElementById('money').textContent=S.money;document.getElementById('cust').textContent=S.cust;qDiv.innerHTML='';S.queue.forEach(o=>{let d=document.createElement('div');d.style.cssText='background:#fff;border:3px solid #000;border-radius:12px;padding:4px 8px';d.textContent=o.i;qDiv.appendChild(d);});}},1200);};
</script></body></html>￼Enter
